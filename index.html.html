<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finances">
<title>Mes finances</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1b2433;--mut:#5f6b82;--line:#dde2ea;--in:#0f7a6b;--out:#b0346a;--acc:#1b2433;--onacc:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2130;--ink:#e8ecf4;--mut:#9aa6bd;--line:#2a3347;--in:#3ccfb8;--out:#f27fae;--acc:#e8ecf4;--onacc:#10151f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2130;--ink:#e8ecf4;--mut:#9aa6bd;--line:#2a3347;--in:#3ccfb8;--out:#f27fae;--acc:#e8ecf4;--onacc:#10151f;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 14px}
.top h1{font-size:1.1rem;margin:0;font-weight:800;text-transform:capitalize}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{min-height:44px;font-size:.8rem;padding:0 2px;border:0;border-radius:10px;background:none;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--acc);color:var(--onacc)}
.tabs svg{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:1rem;margin:0 0 12px;font-weight:800}
.solde{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.big{font-size:2.8rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pair small,.mut{color:var(--mut)}
.pair b{display:block;font-size:1.2rem}
.in{color:var(--in)}.out{color:var(--out)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--in);border-radius:4px}
.bar.over i{background:var(--out)}
.f{display:grid;gap:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:140px;font-size:.85rem}
.go{min-height:48px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font-weight:800}
.ghost{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:none}
.x{min-width:44px;min-height:44px;border:0;background:none;color:var(--mut);font-size:1.2rem}
.cin{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:6px 0}
.cin input{text-align:right}
.tot{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1px solid var(--line);font-weight:800}
.empty{color:var(--mut);padding:8px 0}
.msg{min-height:1.4em;color:var(--out);font-size:.9rem}
.gl{display:flex;gap:8px;margin-top:8px}
.pw{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:18px;align-items:center}
@media(max-width:480px){.pw{grid-template-columns:1fr}}
.pw svg{width:100%;height:auto;max-width:240px;margin:0 auto}
.lg{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:5px 0}
.lg i{width:14px;height:14px;border-radius:4px}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}.pills button{flex:0 0 auto;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:600;color:var(--mut)}.pills button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
:focus-visible{outline:3px solid var(--in);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="nav" onclick="mv(-1)" aria-label="Mois précédent">‹</button>
    <h1 id="mois"></h1>
    <button class="nav" onclick="mv(1)" aria-label="Mois suivant">›</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
<script>
var DEF=["Logement","Courses","Transport","Loisirs","Santé","Abonnements","Autre"];
var KEY="finances-v2";
var S=load(), view="mois", ym=today().slice(0,7);
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.m)return mig(o)}}catch(e){}return mig({m:{},cats:DEF.slice(),goals:[]})}
function mig(o){o.cats=o.cats||DEF.slice();o.goals=o.goals||[];o.icats=o.icats||["Salaire"];o.env=o.env||[];o.sim=o.sim||{};o.cls=o.cls||{};o.goals.forEach(function(g){g.alloc=g.alloc||{};g.date=g.date||""});for(var k in o.m){var m=o.m[k];m.c=m.c||{};if(!m.ic){m.ic={};if(m.inc!==undefined&&m.inc!=="")m.ic[o.icats[0]]=m.inc}delete m.inc}return o}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function eur(n){return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(n)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
function num(v){return String(v||"").split("+").reduce(function(a,p){var n=parseFloat(p.replace(",","."));return a+(isNaN(n)?0:n)},0)}
function G(m){return S.m[m]||{ic:{},c:{}}}
function W(){if(!S.m[ym])S.m[ym]={ic:{},c:{}};return S.m[ym]}
function tot(m){var d=G(m),o=0;for(var k in d.c)o+=num(d.c[k]);var i=0;for(var j in d.ic)i+=num(d.ic[j]);return{i:i,o:o,s:i-o}}
function hasData(m){var d=G(m);for(var j in d.ic)if(d.ic[j]!=="")return true;for(var k in d.c)if(d.c[k]!=="")return true;return false}
function lab(m){return new Date(m+"-01T12:00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}
function mv(n){if(view==="annee"){ym=(+ym.slice(0,4)+n)+ym.slice(4);render();return}var p=ym.split("-").map(Number),y=p[0],m=p[1]+n;if(m>12){m=1;y++}if(m<1){m=12;y--}ym=y+"-"+String(m).padStart(2,"0");render()}
function setView(v){view=v;render()}
function setInc(i,v){W().ic[S.icats[i]]=v;save();upd()}
function setCat(i,v){W().c[S.cats[i]]=v;save();upd()}
function upd(){var t=tot(ym);drawPie();var gm=num(S.goalM);if($("rg"))$("rg").textContent=gm>0?(t.s>=gm?"Objectif de "+eur(gm)+" atteint.":"Objectif de "+eur(gm)+" : il manque "+eur(gm-t.s)+"."):"";
  $("sv").textContent=eur(t.s);$("sv").className="solde big "+(t.s<0?"out":"in");
  $("ri").textContent=eur(t.i);$("ti").textContent=eur(t.i);$("ro").textContent=eur(t.o);$("to").textContent=eur(t.o);
  $("rt").textContent=t.i>0?(t.s>=0?"soit "+Math.round(t.s/t.i*100)+" % de tes revenus":"Tu dépenses plus que tu ne gagnes ce mois-ci."):"Saisis tes revenus pour voir ton taux d’épargne."}
var PC=["#0f7a6b","#b0346a","#3b6fd4","#d9a21b","#7a4fc4","#e0663a","#5a6b82","#2e9d4f","#c4478f","#17a2b8"];
function drawPie(){var el=$("pie");if(!el)return;var d=G(ym),vals=S.cats.map(function(c){return Math.max(0,num(d.c[c]))}),T=vals.reduce(function(a,b){return a+b},0);
  if(!T){el.innerHTML='<div class="empty">Saisis des dépenses pour voir la répartition.</div>';return}
  var svg='<svg viewBox="0 0 200 200" role="img" aria-label="Répartition des dépenses par catégorie">',a=-Math.PI/2,n=vals.filter(function(v){return v>0}).length;
  vals.forEach(function(v,i){if(!v)return;var col=PC[i%PC.length];
    if(n===1){svg+='<circle cx="100" cy="100" r="95" fill="'+col+'"/>';return}
    var b=a+v/T*2*Math.PI,x0=100+95*Math.cos(a),y0=100+95*Math.sin(a),x1=100+95*Math.cos(b),y1=100+95*Math.sin(b);
    svg+='<path d="M100 100L'+x0.toFixed(2)+" "+y0.toFixed(2)+"A95 95 0 "+(b-a>Math.PI?1:0)+" 1 "+x1.toFixed(2)+" "+y1.toFixed(2)+'Z" fill="'+col+'" stroke="var(--card)" stroke-width="2"/>';a=b});
  svg+="</svg>";
  var lg=vals.map(function(v,i){return v?'<div class="lg"><i style="background:'+PC[i%PC.length]+'"></i><span>'+esc(S.cats[i])+'</span><b>'+eur(v)+" ("+Math.round(v/T*100)+" %)</b></div>":""}).join("");
  el.innerHTML='<div class="pw">'+svg+"<div>"+lg+"</div></div>"}
var sub="obj";
function setSub(x){sub=x;render()}
function avg(f){var ms=Object.keys(S.m).filter(hasData);if(!ms.length)return 0;return ms.reduce(function(a,m){return a+tot(m)[f]},0)/ms.length}
function addM(m,n){var p=m.split("-").map(Number),t=p[0]*12+p[1]-1+n;return Math.floor(t/12)+"-"+String(t%12+1).padStart(2,"0")}
function diffM(a,b){var x=a.split("-").map(Number),y=b.split("-").map(Number);return(y[0]-x[0])*12+y[1]-x[1]}
function addGoal(){var n=$("gn").value.trim(),t=num($("gt").value),d=$("gd").value;
  if(!n||!(t>0)){$("msg").textContent="Donne un nom et un objectif en euros.";return}
  S.goals.push({id:Date.now(),name:n,target:t,saved:0,date:d||"",alloc:{}});save();render()}
function moveGoal(id){var v=num($("g"+id).value);if(!v)return;S.goals.forEach(function(g){if(g.id===id)g.saved=Math.max(0,g.saved+v)});save();render()}
function delGoal(id){S.goals=S.goals.filter(function(g){return g.id!==id});save();render()}
function resteM(){var a=0;S.goals.forEach(function(g){a+=(g.alloc&&g.alloc[ym])||0});return Math.max(0,tot(ym).s-a)}
function allocGoal(id){var v=num($("a"+id).value),r=resteM();if(!(v>0))return;
  if(v>r+0.005){$("msg").textContent="Il ne reste que "+eur(r)+" à affecter ce mois-ci.";return}
  S.goals.forEach(function(g){if(g.id===id){g.saved+=v;g.alloc=g.alloc||{};g.alloc[ym]=(g.alloc[ym]||0)+v}});save();render()}
function splitGoals(){var r=resteM(),n=S.goals.length;if(!n||r<=0)return;var p=Math.floor(r/n*100)/100;
  S.goals.forEach(function(g){g.saved+=p;g.alloc=g.alloc||{};g.alloc[ym]=(g.alloc[ym]||0)+p});save();render()}
function createFU(n){var ao=avg("o");if(ao<=0)return;S.goals.push({id:Date.now(),name:"Fonds d’urgence ("+n+" mois)",target:Math.round(ao*n),saved:0,date:"",alloc:{}});save();sub="obj";render()}
function envTot(){return S.env.reduce(function(a,e){return a+e.bal},0)}
function addEnv(){var n=$("en").value.trim();if(!n)return;S.env.push({id:Date.now(),name:n,bal:num($("eb").value)||0});save();render()}
function setEnv(id,v){S.env.forEach(function(e){if(e.id===id)e.bal=num(v)});save();render()}
function delEnv(id){S.env=S.env.filter(function(e){return e.id!==id});save();render()}
function sv(k,d){return S.sim[k]!==undefined?S.sim[k]:d}
function dm(){return avg("s")>0?String(Math.round(avg("s"))):""}
function setSim(k,v){S.sim[k]=v;save();simUpd()}
function si(l,k,d,ph){return'<div class="cin"><label for="s_'+k+'">'+l+'</label><input id="s_'+k+'" inputmode="decimal" placeholder="'+ph+'" value="'+esc(sv(k,d))+'" oninput="setSim(\''+k+'\',this.value)"></div>'}
function simUpd(){
  if($("si")){var P=num(sv("c0","")),M=num(sv("m",dm())),r=num(sv("t","3"))/1200,n=Math.round(num(sv("y","10"))*12),g=r?Math.pow(1+r,n):1,fv=r?P*g+M*(g-1)/r:P+M*n,pd=P+M*n;
    $("si").innerHTML='<div class="row"><div>Capital final</div><b class="in">'+eur(fv)+'</b></div><div class="row"><div>Total versé</div><b>'+eur(pd)+'</b></div><div class="row"><div>Intérêts gagnés</div><b class="in">'+eur(fv-pd)+'</b></div>'}
  if($("sb")){var px=num(sv("px","")),ap=num(sv("ap","")),L=Math.round(num(sv("dur","20"))*12),q=num(sv("tx","3.5"))/1200,E=Math.max(0,px*(1+num(sv("nt","7.5"))/100)-ap),mm=L>0?(q?E*q/(1-Math.pow(1+q,-L)):E/L):0,ai=avg("i"),
    h='<div class="row"><div>Somme à emprunter<br><span class="mut">prix + notaire − apport</span></div><b>'+eur(E)+'</b></div><div class="row"><div>Mensualité</div><b>'+eur(mm)+'</b></div><div class="row"><div>Coût total du crédit</div><b class="out">'+eur(mm*L-E)+'</b></div>';
    if(ai>0&&mm>0){var pc=mm/ai*100;h+='<div class="row"><div>Part de tes revenus moyens<br><span class="mut">35 % est le plafond d’endettement usuel</span></div><b class="'+(pc>35?"out":"in")+'">'+Math.round(pc)+' %</b></div>'}
    $("sb").innerHTML=h}}
function cl(c){return S.cls[c]||(DEF.indexOf(c)>=0&&c!=="Loisirs"&&c!=="Autre"?"b":"e")}
function setCl(i,v){S.cls[S.cats[i]]=v;save();render()}
function epHTML(){
  var P=[["obj","Objectifs"],["suivi","Suivi"],["env","Enveloppes"],["sim","Simulateurs"],["r","50/30/20"]];
  var h='<div class="pills">'+P.map(function(p){return'<button class="'+(sub===p[0]?"on":"")+'" onclick="setSub(\''+p[0]+'\')">'+p[1]+"</button>"}).join("")+'</div><div class="msg" id="msg"></div>';
  return h+(sub==="obj"?hObj():sub==="suivi"?hSuivi():sub==="env"?hEnv():sub==="sim"?hSim():hRule())}
function hObj(){
  var r=resteM(),sv0=tot(ym).s,av=avg("s"),nowM=today().slice(0,7),h='<div class="card"><h2 style="text-transform:capitalize">Économie de '+lab(ym)+'</h2><div class="solde '+(sv0<0?"out":"in")+'">'+eur(sv0)+'</div><div class="mut">Reste à affecter à tes objectifs : '+eur(r)+'</div>';
  if(S.goals.length&&r>0)h+='<div class="gl"><button class="ghost" onclick="splitGoals()">Répartir à parts égales</button></div>';
  h+='</div><div class="card"><h2>Nouvel objectif</h2><div class="f2"><input id="gn" placeholder="Nom (ex. apport)" aria-label="Nom"><input id="gt" inputmode="decimal" placeholder="Objectif €" aria-label="Objectif"></div><div class="f" style="margin-top:10px"><label class="mut" for="gd">Date cible (facultatif)</label><input id="gd" type="month"><button class="go" onclick="addGoal()">Créer l’objectif</button></div></div>';
  if(!S.goals.length)h+='<div class="card empty">Aucun objectif pour l’instant.</div>';
  S.goals.forEach(function(g){
    var p=Math.min(100,g.saved/g.target*100),rem=Math.max(0,g.target-g.saved),info="";
    if(rem<=0)info="Objectif atteint.";
    else{
      if(g.date){var left=diffM(nowM,g.date);info=left>0?"Pour finir à temps : "+eur(rem/left)+" par mois ("+left+" mois restants).":"La date cible est dépassée."}
      if(av>0){var eta=addM(nowM,Math.ceil(rem/av));info+=(info?" ":"")+"À ton rythme moyen ("+eur(av)+" par mois) : "+lab(eta)+".";
        if(g.date){var gap=diffM(eta,g.date);info+=gap>0?" Tu es en avance de "+gap+" mois.":gap===0?" Tu es pile dans les temps.":" Tu as "+(-gap)+" mois de retard."}}
    }
    h+='<div class="card"><div class="row" style="border:0;padding:0"><div><b>'+esc(g.name)+'</b>'+(g.date?' <span class="mut">pour '+lab(g.date)+'</span>':'')+'<br><span class="mut">'+eur(g.saved)+" sur "+eur(g.target)+" ("+Math.round(p)+' %)</span></div><button class="x" aria-label="Supprimer l’objectif" onclick="delGoal('+g.id+')">✕</button><div class="bar"><i style="width:'+p+'%"></i></div></div>'
      +(info?'<p class="mut" style="margin:10px 0 0;font-size:.9rem">'+info+'</p>':'')
      +'<div class="gl"><input id="a'+g.id+'" inputmode="decimal" placeholder="Affecter depuis l’économie du mois" aria-label="Montant à affecter"><button class="ghost" onclick="allocGoal('+g.id+')">Affecter</button></div>'
      +'<div class="gl"><input id="g'+g.id+'" inputmode="decimal" placeholder="Ajout manuel (− pour retirer)" aria-label="Ajout manuel"><button class="ghost" onclick="moveGoal('+g.id+')">Valider</button></div></div>';
  });
  return h}
function hSuivi(){
  var ms=Object.keys(S.m).filter(hasData).sort(),run=0,vals=ms.map(function(m){run+=tot(m).s;return run}),av=avg("s"),h='<div class="card"><h2>Épargne cumulée</h2>';
  if(!ms.length)h+='<div class="empty">Remplis au moins un mois pour voir la courbe.</div>';
  else{
    var n=vals.length,last=vals[n-1],proj=[];
    for(var i=1;i<=12;i++)proj.push(last+av*i);
    var ext=vals.concat(proj),mn=Math.min.apply(null,ext.concat(0)),mx=Math.max.apply(null,ext.concat(0));if(mx===mn)mx=mn+1;
    var T=ext.length,X=function(i){return 10+i*(340/Math.max(1,T-1))},Y=function(v){return 140-(v-mn)/(mx-mn)*120};
    var d1=vals.map(function(v,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)}).join("");
    var d2="M"+X(n-1).toFixed(1)+" "+Y(last).toFixed(1)+proj.map(function(v,i){return"L"+X(n+i).toFixed(1)+" "+Y(v).toFixed(1)}).join("");
    h+='<svg viewBox="0 0 360 160" role="img" aria-label="Épargne cumulée et projection sur 12 mois"><line x1="10" x2="350" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--line)"/><path d="'+d2+'" fill="none" stroke="var(--mut)" stroke-width="2" stroke-dasharray="5 5"/><path d="'+d1+'" fill="none" stroke="var(--in)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="4.5" fill="var(--in)"/></svg>'
      +'<div class="row"><div>Cumul actuel<br><span class="mut" style="text-transform:capitalize">'+lab(ms[n-1])+'</span></div><b class="'+(last<0?"out":"in")+'">'+eur(last)+'</b></div><div class="row"><div>Dans 12 mois, au rythme moyen<br><span class="mut">'+eur(av)+' par mois (pointillés)</span></div><b>'+eur(last+av*12)+'</b></div>';
  }
  h+='</div><div class="card"><h2>Fonds d’urgence</h2>';
  var ao=avg("o"),base=envTot()>0?envTot():S.goals.reduce(function(a,g){return a+g.saved},0);
  if(ao<=0)h+='<div class="empty">Saisis tes dépenses pour calculer ton fonds d’urgence.</div>';
  else{
    var cov=base/ao;
    h+='<div class="mut">Dépenses moyennes : '+eur(ao)+' par mois. Épargne prise en compte : '+eur(base)+(envTot()>0?" (tes enveloppes).":" (tes objectifs).")+'</div><div class="solde '+(cov<3?"out":"in")+'" style="margin-top:8px">'+cov.toFixed(1).replace(".",",")+' mois</div><div class="mut">de dépenses couverts</div><div class="bar'+(cov<3?" over":"")+'" style="margin:12px 0"><i style="width:'+Math.min(100,cov/6*100)+'%"></i></div>';
    [3,6].forEach(function(k){var t=ao*k;h+='<div class="row"><div>'+k+' mois de dépenses<br><span class="mut">'+eur(t)+'</span></div><b class="'+(base>=t?"in":"out")+'">'+(base>=t?"Atteint":"Il manque "+eur(t-base))+'</b></div>'});
    h+='<div class="gl"><button class="ghost" onclick="createFU(3)">Objectif 3 mois</button><button class="ghost" onclick="createFU(6)">Objectif 6 mois</button></div>';
  }
  return h+'</div>'}
function hEnv(){
  var h='<div class="card"><h2>Mes enveloppes</h2>';
  if(!S.env.length)h+='<div class="empty">Ajoute tes comptes d’épargne (livret A, LDDS, assurance-vie…) avec leur solde.</div>';
  S.env.forEach(function(e){h+='<div class="cin"><label for="e'+e.id+'">'+esc(e.name)+' <button class="x" style="min-width:32px;min-height:32px;font-size:.9rem" aria-label="Retirer '+esc(e.name)+'" onclick="delEnv('+e.id+')">✕</button></label><input id="e'+e.id+'" inputmode="decimal" value="'+esc(e.bal)+'" onchange="setEnv('+e.id+',this.value)"></div>'});
  h+='<div class="tot"><span>Total</span><span>'+eur(envTot())+'</span></div></div>'
    +'<div class="card"><h2>Ajouter une enveloppe</h2><div class="f2"><input id="en" placeholder="Nom (ex. Livret A)" aria-label="Nom"><input id="eb" inputmode="decimal" placeholder="Solde €" aria-label="Solde"></div><div class="f" style="margin-top:10px"><button class="go" onclick="addEnv()">Ajouter</button></div></div>';
  if(envTot()>0)h+='<div class="card"><h2>Répartition</h2>'+pieHTML(S.env.map(function(e){return Math.max(0,e.bal)}),S.env.map(function(e){return e.name}))+'</div>';
  return h}
function hSim(){return'<div class="card"><h2>Simulateur d’intérêts</h2>'+si("Capital de départ (€)","c0","","0")+si("Versement mensuel (€)","m",dm(),"0")+si("Taux annuel (%)","t","3","3")+si("Durée (années)","y","10","10")+'<div id="si"></div><p class="mut" style="font-size:.85rem;margin:8px 0 0">Estimation indicative : intérêts capitalisés chaque mois, sans impôts ni frais.</p></div>'
  +'<div class="card"><h2>Simulateur de mensualité immobilière</h2>'+si("Prix du bien (€)","px","","0")+si("Apport (€)","ap","","0")+si("Durée (années)","dur","20","20")+si("Taux du crédit (%)","tx","3.5","3.5")+si("Frais de notaire (%)","nt","7.5","7.5")+'<div id="sb"></div><p class="mut" style="font-size:.85rem;margin:8px 0 0">Estimation indicative, hors assurance emprunteur.</p></div>'}
function hRule(){
  var t=tot(ym),d=G(ym),B=0,E=0;S.cats.forEach(function(c){var v=num(d.c[c]);if(cl(c)==="b")B+=v;else E+=v});
  var I=t.i,h='<div class="card"><h2 style="text-transform:capitalize">Règle 50/30/20, '+lab(ym)+'</h2>';
  if(I<=0)h+='<div class="empty">Saisis tes revenus du mois pour voir la répartition.</div>';
  else[["Besoins",B/I*100,50,false],["Envies",E/I*100,30,false],["Épargne",Math.max(0,t.s)/I*100,20,true]].forEach(function(r){var ok=r[3]?r[1]>=r[2]:r[1]<=r[2];h+='<div class="row"><div>'+r[0]+'<br><span class="mut">objectif '+(r[3]?"au moins ":"au plus ")+r[2]+' %</span></div><b class="'+(ok?"in":"out")+'">'+Math.round(r[1])+' %</b><div class="bar'+(ok?"":" over")+'"><i style="width:'+Math.min(100,r[1])+'%"></i></div></div>'});
  h+='</div><div class="card"><h2>Classer mes catégories</h2>';
  S.cats.forEach(function(c,i){h+='<div class="cin"><label for="k'+i+'">'+esc(c)+'</label><select id="k'+i+'" onchange="setCl('+i+',this.value)"><option value="b"'+(cl(c)==="b"?" selected":"")+'>Besoins</option><option value="e"'+(cl(c)==="e"?" selected":"")+'>Envies</option></select></div>'});
  return h+'<p class="mut" style="font-size:.85rem;margin:8px 0 0">Repère indicatif : 50 % de besoins, 30 % d’envies, 20 % d’épargne.</p></div>'}
function setGM(v){S.goalM=v;save();upd()}
function bk(){var n=Object.keys(S.m).filter(hasData).length;if(!n)return"";var l=S.lastExp;var days=l?Math.floor((new Date(today()+"T12:00:00")-new Date(l+"T12:00:00"))/864e5):999;return days>30?'<div class="card" style="border-color:var(--out)">'+(l?"Dernière sauvegarde il y a "+days+" jours.":"Tu n’as encore jamais sauvegardé.")+' Copie ta sauvegarde dans l’onglet Données pour ne rien perdre.</div>':""}
function pieHTML(vals,names){var T=vals.reduce(function(a,b){return a+b},0);if(!T)return'<div class="empty">Rien à afficher.</div>';
 var svg='<svg viewBox="0 0 200 200" role="img" aria-label="Répartition">',a=-Math.PI/2,n=vals.filter(function(v){return v>0}).length;
 vals.forEach(function(v,i){if(v<=0)return;var col=PC[i%PC.length];
  if(n===1){svg+='<circle cx="100" cy="100" r="95" fill="'+col+'"/>';return}
  var b=a+v/T*2*Math.PI,x0=100+95*Math.cos(a),y0=100+95*Math.sin(a),x1=100+95*Math.cos(b),y1=100+95*Math.sin(b);
  svg+='<path d="M100 100L'+x0.toFixed(2)+" "+y0.toFixed(2)+"A95 95 0 "+(b-a>Math.PI?1:0)+" 1 "+x1.toFixed(2)+" "+y1.toFixed(2)+'Z" fill="'+col+'" stroke="var(--card)" stroke-width="2"/>';a=b});
 var lg=vals.map(function(v,i){return v>0?'<div class="lg"><i style="background:'+PC[i%PC.length]+'"></i><span>'+esc(names[i])+'</span><b>'+eur(v)+" ("+Math.round(v/T*100)+" %)</b></div>":""}).join("");
 return'<div class="pw">'+svg+"</svg><div>"+lg+"</div></div>"}
function addICat(){var n=$("ni").value.trim();if(!n)return;if(S.icats.indexOf(n)<0)S.icats.push(n);save();render()}
function delICat(i){var c=S.icats[i];for(var m in S.m){var v=(S.m[m].ic||{})[c];if(v!==undefined&&v!==""){$("msg").textContent="« "+c+" » contient des montants. Vide-les d’abord dans chaque mois.";return}}S.icats.splice(i,1);save();render()}
function addCat(){var n=$("nc").value.trim();if(!n)return;if(S.cats.indexOf(n)<0)S.cats.push(n);save();render()}
function delCat(i){var c=S.cats[i];
  for(var m in S.m){if(S.m[m].c[c]!==undefined&&S.m[m].c[c]!==""){$("msg").textContent="« "+c+" » contient des montants. Vide-les d’abord dans chaque mois.";return}}
  S.cats.splice(i,1);save();render()}
function copyPrev(){var p=ym.split("-").map(Number),y=p[0],m=p[1]-1;if(m<1){m=12;y--}var k=y+"-"+String(m).padStart(2,"0");
  if(!hasData(k)){$("msg").textContent="Aucune donnée le mois précédent.";return}
  S.m[ym]=JSON.parse(JSON.stringify(G(k)));save();render()}
function exportData(){S.lastExp=today();save();var t=$("dump");t.value=JSON.stringify(S);t.select();
  try{navigator.clipboard.writeText(t.value);$("msg").textContent="Sauvegarde copiée. Colle-la dans une note."}catch(e){$("msg").textContent="Copie le texte sélectionné."}}
function importData(){try{var o=JSON.parse($("dump").value);if(!o||typeof o.m!=="object")throw 0;
  S=mig(o);save();render()}catch(e){$("msg").textContent="Ce texte n’est pas une sauvegarde valide."}}
function render(){
  $("mois").textContent=view==="annee"?ym.slice(0,4):lab(ym);
  var T=[["mois","Mois"],["comp","Comparaison"],["annee","Année"],["epargne","Épargne"],["data","Données"]];
  var IC={mois:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',comp:'<svg viewBox="0 0 24 24"><path d="M7 20V5M7 5L3.5 8.5M7 5l3.5 3.5M17 4v15M17 19l-3.5-3.5M17 19l3.5-3.5"/></svg>',annee:'<svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg>',epargne:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>',data:'<svg viewBox="0 0 24 24"><path d="M4 14l2-8h12l2 8v5H4zM4 14h4.5l1 2h5l1-2H20"/></svg>'};
  $("tabs").innerHTML=T.map(function(t){return'<button class="'+(view===t[0]?"on":"")+'" aria-label="'+t[1]+'" onclick="setView(\''+t[0]+'\')">'+IC[t[0]]+"<span>"+t[1]+"</span></button>"}).join("");
  var h="";
  if(view==="mois"){
    var d=G(ym);
    h=bk()+'<div class="card"><div class="mut">Économisé ce mois-ci</div><div id="sv" class="solde big"></div><div class="mut" id="rt"></div><div class="mut" id="rg"></div><div class="pair"><div><small>Revenus</small><b class="in" id="ri"></b></div><div><small>Dépenses</small><b class="out" id="ro"></b></div></div></div>';
    h+='<div class="card"><h2>Répartition des dépenses</h2><div id="pie"></div></div>';
    h+='<div class="card"><h2>Revenus</h2><p class="mut" style="margin:0 0 6px;font-size:.9rem">Tu peux additionner dans un champ, par exemple 1500+200.</p>';
    S.icats.forEach(function(c,i){h+='<div class="cin"><label for="i'+i+'">'+esc(c)+' <button class="x" style="min-width:32px;min-height:32px;font-size:.9rem" aria-label="Retirer la catégorie '+esc(c)+'" onclick="delICat('+i+')">✕</button></label><input id="i'+i+'" inputmode="decimal" placeholder="0" value="'+esc(d.ic[c]===undefined?"":d.ic[c])+'" oninput="setInc('+i+',this.value)"></div>'});
    h+='<div class="tot"><span>Total des revenus</span><span class="in" id="ti"></span></div></div>';
    h+='<div class="card"><h2>Dépenses par catégorie</h2>';
    S.cats.forEach(function(c,i){
      h+='<div class="cin"><label for="c'+i+'">'+esc(c)+' <button class="x" style="min-width:32px;min-height:32px;font-size:.9rem" aria-label="Retirer la catégorie '+esc(c)+'" onclick="delCat('+i+')">✕</button></label><input id="c'+i+'" inputmode="decimal" placeholder="0" value="'+esc(d.c[c]===undefined?"":d.c[c])+'" oninput="setCat('+i+',this.value)"></div>';
    });
    h+='<div class="tot"><span>Total des dépenses</span><span class="out" id="to"></span></div></div>';
    h+='<div class="card"><h2>Gérer</h2><div class="gl"><input id="ni" placeholder="Nouvelle catégorie de revenus" aria-label="Nouvelle catégorie de revenus"><button class="ghost" onclick="addICat()">Ajouter</button></div><div class="gl"><input id="nc" placeholder="Nouvelle catégorie de dépenses" aria-label="Nouvelle catégorie de dépenses"><button class="ghost" onclick="addCat()">Ajouter</button></div><div class="gl"><input id="gm" inputmode="decimal" placeholder="Objectif d’économie par mois (€)" aria-label="Objectif d’économie par mois" value="'+esc(S.goalM||"")+'" oninput="setGM(this.value)"></div><div class="gl"><button class="ghost" onclick="copyPrev()">Reprendre les montants du mois précédent</button></div><div class="msg" id="msg"></div></div>';
  }else if(view==="comp"){
    var pp=ym.split("-").map(Number),py=pp[0],pm=pp[1]-1;if(pm<1){pm=12;py--}
    var pk=py+"-"+String(pm).padStart(2,"0"),ca=G(ym),cb=G(pk),ta=tot(ym),tb=tot(pk);
    var R=function(n,x,y,upGood,bold){var d=x-y,cl=d===0?"mut":((d>0)===upGood?"in":"out");
      var ds=d===0?"=":(d>0?"+":"−")+eur(Math.abs(d));
      return'<div class="row"><div>'+(bold?"<b>"+n+"</b>":n)+'<br><span class="mut">'+eur(x)+" (avant : "+eur(y)+')</span></div><b class="'+cl+'">'+ds+'</b></div>'};
    h='<div class="card"><h2 style="text-transform:capitalize">'+lab(ym)+" comparé à "+lab(pk)+"</h2>";
    if(!hasData(pk))h+='<div class="empty">Aucune donnée le mois précédent. Remplis-le dans l’onglet Mois pour comparer.</div>';
    h+=R("Économisé",ta.s,tb.s,true,true)+R("Revenus",ta.i,tb.i,true,false);S.icats.forEach(function(c){h+=R(esc(c),num(ca.ic[c]),num(cb.ic[c]),true,false)});h+="</div>";
    h+='<div class="card"><h2>Dépenses par catégorie</h2>';
    S.cats.forEach(function(c){h+=R(esc(c),num(ca.c[c]),num(cb.c[c]),false,false)});
    h+=R("Total des dépenses",ta.o,tb.o,false,true)+"</div>";
  }else if(view==="annee"){
    var Y=ym.slice(0,4),ms=[],I=0,O=0,df=0,best=null,worst=null,mx=0;
    for(var q=1;q<=12;q++){var k=Y+"-"+String(q).padStart(2,"0"),t=tot(k),on=hasData(k);
      ms.push({k:k,t:t,on:on});
      if(on){I+=t.i;O+=t.o;if(t.s<0)df++;if(!best||t.s>best.t.s)best=ms[q-1];if(!worst||t.s<worst.t.s)worst=ms[q-1]}
      mx=Math.max(mx,t.i,t.o)}
    var N=ms.filter(function(x){return x.on}).length,SV=I-O;
    if(!N){h='<div class="card empty">Aucune donnée en '+Y+'. Remplis l’onglet Mois pour voir l’analyse.</div>'}
    else{
      h='<div class="card"><div class="mut">Économisé en '+Y+'</div><div class="solde big '+(SV<0?"out":"in")+'">'+eur(SV)+'</div><div class="mut">'+(I>0?"soit "+Math.round(SV/I*100)+" % de tes revenus":"")+'</div><div class="pair"><div><small>Revenus</small><b class="in">'+eur(I)+'</b></div><div><small>Dépenses</small><b class="out">'+eur(O)+'</b></div></div></div>';
      h+='<div class="card"><h2>En bref</h2><div class="row"><div>Mois renseignés</div><b>'+N+' sur 12</b></div>'
        +'<div class="row"><div>Économie moyenne par mois</div><b class="'+(SV<0?"out":"in")+'">'+eur(SV/N)+'</b></div>'
        +'<div class="row"><div>Mois en négatif</div><b class="'+(df?"out":"in")+'">'+df+'</b></div>';
      if(O>0&&SV>0)h+='<div class="row"><div>Ton épargne couvre</div><b>'+(SV/(O/N)).toFixed(1).replace(".",",")+' mois de dépenses</b></div>';
      h+='<div class="row"><div>Meilleur mois<br><span class="mut" style="text-transform:capitalize">'+lab(best.k)+'</span></div><b class="in">'+eur(best.t.s)+'</b></div>'
        +'<div class="row"><div>Mois le plus faible<br><span class="mut" style="text-transform:capitalize">'+lab(worst.k)+'</span></div><b class="'+(worst.t.s<0?"out":"in")+'">'+eur(worst.t.s)+'</b></div></div>';
      var sv='<svg viewBox="0 0 360 160" role="img" aria-label="Revenus et dépenses par mois">';
      ms.forEach(function(x,i){var X=8+i*29,hi=mx?x.t.i/mx*120:0,ho=mx?x.t.o/mx*120:0;
        sv+='<rect x="'+X+'" y="'+(130-hi)+'" width="11" height="'+hi+'" rx="2" fill="var(--in)"/><rect x="'+(X+12)+'" y="'+(130-ho)+'" width="11" height="'+ho+'" rx="2" fill="var(--out)"/><text x="'+(X+11)+'" y="148" text-anchor="middle" font-size="10" fill="var(--mut)">'+"JFMAMJJASOND".charAt(i)+"</text>"});
      h+='<div class="card"><h2>Mois par mois</h2>'+sv+'</svg><div class="gl" style="gap:16px"><span class="in">■ Revenus</span><span class="out">■ Dépenses</span></div></div>';
      var vals=S.cats.map(function(c){return ms.reduce(function(a,x){return a+Math.max(0,num(G(x.k).c[c]))},0)});
      h+='<div class="card"><h2>Répartition des dépenses sur l’année</h2>'+pieHTML(vals,S.cats)+'</div>';
      h+='<div class="card"><h2>Total et moyenne par mois</h2>';
      S.icats.forEach(function(c){var v=ms.reduce(function(a,x){return a+num(G(x.k).ic[c])},0);h+='<div class="row"><div>'+esc(c)+'<br><span class="mut">moyenne '+eur(v/N)+'</span></div><b class="in">'+eur(v)+'</b></div>'});
      S.cats.forEach(function(c,i){h+='<div class="row"><div>'+esc(c)+'<br><span class="mut">moyenne '+eur(vals[i]/N)+'</span></div><b class="out">'+eur(vals[i])+'</b></div>'});
      h+='</div>';
    }
  }else if(view==="epargne"){h=epHTML();
  }else{
    h='<div class="card"><h2>Sauvegarde</h2><p class="mut" style="margin:0 0 6px">'+(S.lastExp?"Dernière sauvegarde : "+new Date(S.lastExp+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"Jamais sauvegardé")+'.</p><p class="mut">Tes données restent dans Safari sur cet appareil. Copie la sauvegarde dans une note pour la garder, ou colle-en une pour restaurer.</p><div class="f"><textarea id="dump" aria-label="Sauvegarde"></textarea><div class="f2"><button class="go" onclick="exportData()">Copier la sauvegarde</button><button class="ghost" onclick="importData()">Restaurer</button></div><div class="msg" id="msg"></div></div></div>';
  }
  $("view").innerHTML=h;
  if(view==="mois")upd();if(view==="epargne")simUpd();
}
document.addEventListener("focusin",function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))document.body.classList.add("kb")});
document.addEventListener("focusout",function(){document.body.classList.remove("kb")});
render();
</script>
